# Android field client CI: assemble the debug APK, lint, and run the JVM
# unit tests on every change under android/. The live-server smoke
# (LiveServerSmokeTest) self-skips without a running server — CI is
# deterministic; the runtime smoke runs against a sandbox server manually.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  client:
    name: Android app (assemble, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No SDK setup step: ubuntu runners ship a complete, license-accepted
      # Android SDK ($ANDROID_HOME). android-actions/setup-android@v3 runs
      # `sdkmanager tools`, which fails — the deprecated 'tools' package no
      # longer exists in the SDK repository.

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Archive APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcptt-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
