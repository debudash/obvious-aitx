name: MCPTT CI

on:
  pull_request:
    branches: [main]
    paths: ["mcptt/**"]
  push:
    branches: [main]
    paths: ["mcptt/**"]

permissions:
  contents: read

jobs:
  server:
    name: Go server (build, lint, race tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcptt/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: mcptt/server/go.sum

      - name: Build
        run: go build ./...

      - name: Lint (gofmt + go vet)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
          go vet ./...

      - name: Tests (race detector)
        run: go test -race ./...

  ios-core:
    # The Linux-testable half of the iOS client: MCPTTCore (protocol codecs,
    # floor reducer, stores, resilience) has no Apple-only imports, so CI
    # builds and tests it. Toolchain is installed as a binary (setup-swift)
    # rather than a container: Docker Hub's unauthenticated pull rate limit
    # rejects container jobs on shared runner IPs. The SwiftUI/WebRTC app
    # layer needs Xcode and is a documented follow-up (mcptt/ios/README.md).
    name: iOS core (Swift build + tests)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mcptt/ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.0.3
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Build
        run: swift build

      - name: Tests
        run: swift test

  console:
    name: Web console (lint, typecheck, vitest, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcptt/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcptt/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (state layer)
        run: npx vitest run

      - name: Set up Go (for the e2e server)
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: mcptt/server/go.sum

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E flows against a real server
        run: bash scripts/e2e.sh
