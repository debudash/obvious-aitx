name: MCPTT CI

on:
  pull_request:
    branches: [main]
    paths: ["mcptt/**"]
  push:
    branches: [main]
    paths: ["mcptt/**"]

permissions:
  contents: read

jobs:
  server:
    name: Go server (build, lint, race tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcptt/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: mcptt/server/go.sum

      - name: Build
        run: go build ./...

      - name: Lint (gofmt + go vet)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
          go vet ./...

      - name: Tests (race detector)
        run: go test -race ./...

  ios-core:
    # The Linux-testable half of the iOS client: MCPTTCore (protocol codecs,
    # floor reducer, stores, resilience) has no Apple-only imports, so the
    # official Swift container builds and tests it. The SwiftUI/WebRTC app
    # layer needs Xcode and is a documented follow-up (mcptt/ios/README.md).
    name: iOS core (Swift build + tests)
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    defaults:
      run:
        working-directory: mcptt/ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Tests
        run: swift test
