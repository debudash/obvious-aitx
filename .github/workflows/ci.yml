name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest with coverage)
        # Coverage gate scoped to the layers that carry normalization risk:
        # the shared model, config, and the venue adapters (base + both
        # venues). Matcher/router tasks raise their own gates as they land.
        run: pytest --cov=equinox.model --cov=equinox.config --cov=equinox.venues --cov-fail-under=85 --cov-report=term-missing
