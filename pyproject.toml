[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equinox"
version = "0.1.0"
description = "Cross-venue prediction market normalization and routing spike"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equinox"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-API smoke tests are opt-in: `pytest -m live`. The CLI flag overrides this
# default deselection (addopts are prepended, command line wins).
addopts = "-m 'not live'"
markers = [
    "live: opt-in smoke tests against real venue APIs (deselected by default; run with `pytest -m live`)",
]

[tool.coverage.run]
# Kept in sync with the CI gate (see .github/workflows/ci.yml): coverage is
# scoped to the model package, config module, and the venue adapters.
source = ["equinox.model", "equinox.config", "equinox.venues"]
branch = true

[tool.coverage.report]
show_missing = true
